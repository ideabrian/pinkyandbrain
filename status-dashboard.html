<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Status Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 32px;
      font-weight: 300;
    }
    .timestamp {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .machines {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .machine-card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 24px;
      border: 2px solid #3a3a3a;
      transition: all 0.3s ease;
    }
    .machine-card.online {
      border-color: #00ff88;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
    }
    .machine-card.offline {
      border-color: #ff4444;
      opacity: 0.6;
    }
    .machine-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .machine-name {
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .status-indicator.online {
      background: #00ff88;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }
    .status-indicator.offline {
      background: #ff4444;
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .machine-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
      color: #ccc;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #3a3a3a;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #888;
    }
    .info-value {
      color: #fff;
      font-weight: 500;
    }
    .claude-active {
      display: inline-block;
      padding: 4px 12px;
      background: #00ff88;
      color: #1a1a1a;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .claude-inactive {
      display: inline-block;
      padding: 4px 12px;
      background: #3a3a3a;
      color: #888;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .refresh-button {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #00ff88;
      color: #1a1a1a;
      border: none;
      padding: 16px 24px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
      transition: all 0.3s ease;
    }
    .refresh-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(0, 255, 136, 0.4);
    }
    .auto-refresh {
      color: #888;
      font-size: 12px;
      margin-top: 10px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Team Status Dashboard</h1>
    <div class="timestamp">Last updated: <span id="last-update">--</span></div>
    <div class="machines" id="machines-container">
      <!-- Machine cards will be inserted here -->
    </div>
    <div class="auto-refresh" id="auto-refresh">Auto-refreshing in <span id="countdown">10</span>s</div>
  </div>

  <button class="refresh-button" onclick="fetchStatus()">Refresh Now</button>

  <script>
    const API_URL = 'http://localhost:3001/api/status';
    let countdown = 10;
    let countdownInterval;

    async function fetchStatus() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        updateDashboard(data);
        document.getElementById('last-update').textContent = new Date().toLocaleTimeString();

        // Reset countdown
        countdown = 10;
        startCountdown();
      } catch (error) {
        console.error('Failed to fetch status:', error);
        document.getElementById('machines-container').innerHTML =
          '<p style="color: #ff4444;">Error loading status. Make sure the API server is running on port 3001.</p>';
      }
    }

    function updateDashboard(data) {
      const container = document.getElementById('machines-container');
      container.innerHTML = '';

      if (!data.machines || data.machines.length === 0) {
        container.innerHTML = '<p style="color: #888;">No machines reporting yet. Start heartbeat services on each machine.</p>';
        return;
      }

      data.machines
        .sort((a, b) => a.machine.localeCompare(b.machine))
        .forEach(machine => {
          const card = createMachineCard(machine);
          container.appendChild(card);
        });
    }

    function createMachineCard(machine) {
      const card = document.createElement('div');
      card.className = `machine-card ${machine.online ? 'online' : 'offline'}`;

      const claudeStatus = machine.claude_active > 0
        ? `<span class="claude-active">ACTIVE</span>`
        : `<span class="claude-inactive">idle</span>`;

      card.innerHTML = `
        <div class="machine-header">
          <div class="machine-name">
            <span class="status-indicator ${machine.online ? 'online' : 'offline'}"></span>
            ${machine.machine}
          </div>
          ${claudeStatus}
        </div>
        <div class="machine-info">
          <div class="info-row">
            <span class="info-label">Status</span>
            <span class="info-value">${machine.online ? 'Online' : 'Offline'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Last Seen</span>
            <span class="info-value">${machine.age_human || 'unknown'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Uptime</span>
            <span class="info-value">${machine.uptime || 'unknown'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Load</span>
            <span class="info-value">${machine.load || 'unknown'}</span>
          </div>
          ${machine.last_command && machine.last_command !== 'none' ? `
          <div class="info-row">
            <span class="info-label">Last Command</span>
            <span class="info-value" style="font-size: 11px; font-family: monospace;">${machine.last_command.substring(0, 30)}...</span>
          </div>
          ` : ''}
        </div>
      `;

      return card;
    }

    function startCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      countdownInterval = setInterval(() => {
        countdown--;
        document.getElementById('countdown').textContent = countdown;

        if (countdown <= 0) {
          fetchStatus();
        }
      }, 1000);
    }

    // Initial fetch
    fetchStatus();
  </script>
</body>
</html>
