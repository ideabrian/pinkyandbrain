<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinky & Brain - Live Timeline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
      animation: fadeIn 0.8s ease-in;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .subtitle {
      font-size: 1.2em;
      opacity: 0.9;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(255,255,255,0.95);
      padding: 20px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      animation: slideUp 0.6s ease-out;
    }

    .stat-value {
      font-size: 2.5em;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      color: #666;
      margin-top: 5px;
    }

    .timeline {
      position: relative;
      padding-left: 50px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: rgba(255,255,255,0.3);
    }

    .timeline-event {
      position: relative;
      background: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      animation: slideIn 0.5s ease-out;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .timeline-event:hover {
      transform: translateX(5px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .timeline-event::before {
      content: attr(data-icon);
      position: absolute;
      left: -45px;
      top: 25px;
      width: 40px;
      height: 40px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      z-index: 1;
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .event-title {
      font-size: 1.3em;
      font-weight: 600;
      color: #333;
      flex: 1;
    }

    .event-machine {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 500;
      margin-left: 10px;
    }

    .machine-brain {
      background: #e3f2fd;
      color: #1976d2;
    }

    .machine-pinky {
      background: #fce4ec;
      color: #c2185b;
    }

    .machine-maxyolo {
      background: #e8f5e9;
      color: #388e3c;
    }

    .machine-ios-shortcut {
      background: #fff3e0;
      color: #f57c00;
    }

    .event-description {
      color: #666;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .event-timestamp {
      color: #999;
      font-size: 0.9em;
    }

    .event-type {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.8em;
      background: #f5f5f5;
      color: #666;
      margin-left: 10px;
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 1.2em;
      padding: 40px;
    }

    .empty-state {
      text-align: center;
      background: white;
      padding: 60px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .empty-state-icon {
      font-size: 4em;
      margin-bottom: 20px;
    }

    .empty-state-text {
      font-size: 1.3em;
      color: #666;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @media (max-width: 768px) {
      h1 { font-size: 2em; }
      .timeline { padding-left: 40px; }
      .timeline-event::before { left: -35px; width: 30px; height: 30px; font-size: 1.2em; }
      .event-header { flex-direction: column; }
      .event-machine { margin-left: 0; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧠 Pinky & Brain</h1>
      <div class="subtitle">Real-Time Autonomous Workflow Timeline</div>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="event-count">0</div>
        <div class="stat-label">Events</div>
      </div>
      <div class="stat-card">
        <div class="stat-value pulse" id="status">●</div>
        <div class="stat-label">Live</div>
      </div>
    </div>

    <div class="timeline" id="timeline">
      <div class="loading">Loading timeline...</div>
    </div>
  </div>

  <script>
    const API_URL = 'https://pinky-brain-hub.b-9f2.workers.dev/timeline';
    let lastEventId = null;

    const machineIcons = {
      'brain': '🧠',
      'pinky': '💖',
      'maxyolo': '🎮',
      'ios-shortcut': '📱'
    };

    function formatTimestamp(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;

      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;

      return date.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function renderEvent(event) {
      const icon = event.icon || machineIcons[event.machine] || '📌';
      const machineClass = `machine-${event.machine}`;

      return `
        <div class="timeline-event" data-icon="${icon}" data-event-id="${event.id}">
          <div class="event-header">
            <div class="event-title">${event.title}</div>
            <div class="event-machine ${machineClass}">${event.machine}</div>
          </div>
          ${event.description ? `<div class="event-description">${event.description}</div>` : ''}
          <div class="event-timestamp">
            ${formatTimestamp(event.timestamp)}
            <span class="event-type">${event.event_type}</span>
          </div>
        </div>
      `;
    }

    async function fetchTimeline() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data.events && data.events.length > 0) {
          // Check for new events
          const newestEventId = data.events[0].id;
          const hasNewEvents = lastEventId !== null && newestEventId !== lastEventId;

          lastEventId = newestEventId;

          // Update UI
          document.getElementById('event-count').textContent = data.total;

          const timeline = document.getElementById('timeline');
          timeline.innerHTML = data.events.map(renderEvent).join('');

          // Flash status indicator for new events
          if (hasNewEvents) {
            const status = document.getElementById('status');
            status.style.color = '#4caf50';
            setTimeout(() => status.style.color = '#667eea', 1000);
          }
        } else {
          document.getElementById('timeline').innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📭</div>
              <div class="empty-state-text">No events yet. Start a workflow!</div>
            </div>
          `;
        }
      } catch (error) {
        console.error('Error fetching timeline:', error);
        document.getElementById('timeline').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <div class="empty-state-text">Error loading timeline</div>
          </div>
        `;
      }
    }

    // Initial load
    fetchTimeline();

    // Auto-refresh every 3 seconds
    setInterval(fetchTimeline, 3000);

    // Update relative timestamps every 10 seconds
    setInterval(() => {
      document.querySelectorAll('.event-timestamp').forEach(el => {
        const eventEl = el.closest('.timeline-event');
        const eventId = eventEl.dataset.eventId;
        // Re-render would be needed here if we stored event data
      });
    }, 10000);
  </script>
</body>
</html>
